<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earn the Win — Two Decisions</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* Keep the consequence line clear of the decision panel */
  .toasts { bottom: 190px; }

  /* Two-step tracker: step 2 is visibly shut until step 1 is earned */
  .steps { display: flex; gap: 8px; }
  .step {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px 6px 8px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 12.5px; font-weight: 700; color: var(--ink-dim);
  }
  .step .n {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 800;
    background: var(--grey); color: var(--ink-dim);
  }
  .step.now { border-color: var(--blue); color: var(--blue); }
  .step.now .n { background: var(--blue); color: #fff; }
  .step.done { border-color: var(--mint); }
  .step.done .n { background: var(--mint); color: #0C1A16; }
  .step.locked { opacity: .5; }

  /* Decision panel */
  .deck { width: 100%; display: flex; flex-direction: column; gap: 11px; }
  .deck .prompt { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .deck .note { font-size: 13px; color: var(--ink-dim); }
  .opts { display: flex; gap: 9px; flex-wrap: wrap; }
  .opts .btn { flex: 1 1 170px; }

  .support {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--grey); border-left: 3px solid var(--mint);
    border-radius: var(--r-sm); padding: 10px 12px;
    font-size: 13px; color: var(--ink-dim);
    animation: support-in .3s cubic-bezier(.2,.9,.3,1) both;
  }
  .support.firm { border-left-color: var(--blue); }
  .support b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
  @keyframes support-in { from { opacity: 0; transform: translateY(8px); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar" style="align-items:flex-start">
    <div class="panel" style="max-width:min(400px,50vw)">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
      <div class="steps" id="steps"></div>
      <button class="btn ghost clickable" id="restart" type="button">Restart</button>
    </div>
  </div>

  <div style="flex:1"></div>

  <div class="panel clickable" id="bottom" style="width:min(660px,96vw);margin:0 auto"></div>
</div>

<div class="loading" id="loading">Opening the office…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
