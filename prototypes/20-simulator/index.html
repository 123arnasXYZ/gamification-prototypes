<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Learners Experiment — Service Desk Simulator</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The 2D board is drawn in the room the overlay leaves it, so the
     overlay is laid out in two columns: the board's column on the
     left (topbar at the top, hint at the bottom) and the challenge
     rail down the right. main.js measures these and fits the board
     between them. */
  .ui-layer { flex-direction: row; gap: 14px; align-items: stretch; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  .rail {
    width: min(400px, 38vw);
    align-self: stretch;
    overflow-y: auto;
    padding: 14px 16px;
  }

  /* Messages sit above the hint rather than on it */
  .toasts { bottom: 78px; }

  .brief h2 { color: var(--blue); font-size: 19px; margin: 2px 0 6px; line-height: 1.15; }
  .brief .line { font-size: 13.5px; color: var(--ink); margin: 0 0 10px; }

  /* Goals read as a checklist of the thing being asked for, not as
     options: they are never clickable. */
  .goals { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 11px; padding: 0; list-style: none; }
  .goals li {
    font-size: 12px; font-weight: 700; color: var(--ink-dim);
    background: var(--grey); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px;
  }

  /* What the last run did. Neutral by design — no pass/fail colour on
     the lines themselves, just the facts of the week. */
  .said {
    border-left: 3px solid var(--line-2);
    background: var(--grey);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    padding: 8px 12px;
    margin: 0 0 10px;
  }
  .said.met { border-left-color: var(--mint); }
  .said .eyebrow { color: var(--ink-dim); margin-bottom: 3px; }
  .said p { font-size: 12.5px; color: var(--ink); line-height: 1.5; margin: 0; }

  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
  .row .grow { flex: 1 0 100%; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); }

  .outcome h2 { color: var(--blue); font-size: 20px; margin: 2px 0 6px; line-height: 1.1; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="col" id="col">
    <div class="topbar" id="topbar" style="align-items:flex-start">
      <div class="panel" style="max-width:min(440px,54vw)">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
      </div>
      <div class="spacer"></div>
      <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
        <div class="stats" id="stats"></div>
        <button class="btn ghost clickable" id="restart" type="button">Restart</button>
      </div>
    </div>

    <div style="flex:1"></div>

    <div class="dock" id="dock">
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <aside class="panel rail clickable" id="brief"></aside>
</div>

<div class="loading" id="loading">Opening the service desk…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
