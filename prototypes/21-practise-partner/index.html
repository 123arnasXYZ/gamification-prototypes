<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Someone to Practise With — The One-to-One</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The talk panel across the bottom is tall, so messages move to the
     top right strip instead of landing on top of it. */
  .toasts {
    left: auto; right: 18px; bottom: auto; top: 112px;
    transform: none; align-items: flex-end; max-width: min(360px, 44vw);
  }

  /* ---- the panel the decision is made in. Her words are on the
     canvas, in a bubble beside her; this panel is only ever about
     which moment you are in and what the two buttons do. ---- */
  .talk { width: min(680px, 100%); margin: 0 auto; position: relative; }

  /* ---- "How this works", before the first turn. Floated above the
     panel rather than sitting inside it, so the panel keeps exactly
     one height and the scene behind it never rescales when the note
     is taken away. ---- */
  .talk .howto {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 10px);
    background: #fff; border: 1px solid var(--line);
    border-left: 3px solid var(--blue);
    border-radius: var(--r-sm);
    box-shadow: var(--shadow-sm);
    padding: 9px 12px;
    font-size: 12.5px; line-height: 1.45; color: var(--ink-dim);
  }
  .talk .howto b {
    display: block; color: var(--ink);
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 3px;
  }
  .talk .howto.gone { display: none; }

  /* ---- The live status. Sits directly on top of the buttons, big
     enough that it cannot be mistaken for a caption. ---- */
  .talk .cue {
    display: flex; align-items: center; gap: 10px;
    border: 2px solid #CED4E0; border-radius: var(--r);
    background: #fff; padding: 10px 13px; margin-bottom: 10px;
    font-size: 14.5px; font-weight: 800; line-height: 1.3;
    color: var(--ink-dim); min-height: 42px;
    transition: border-color .18s ease, color .18s ease, background .18s ease;
  }
  .talk .cue .dot {
    flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%;
    background: #9AA2B2;
  }
  .talk .cue.wait { color: var(--ink); }
  .talk .cue.open {
    border-color: var(--good); color: #0C8460; background: #F1FBF7;
  }
  .talk .cue.open .dot { background: var(--good); animation: cuePulse .9s ease-in-out infinite; }
  .talk .cue.over {
    border-color: #C98A10; color: #8F6310; background: #FDF7EA;
  }
  .talk .cue.over .dot { background: #C98A10; animation: cuePulse .5s ease-in-out infinite; }
  @keyframes cuePulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.5); opacity: .55; }
  }

  /* ---- The two buttons, each carrying its own one-line guidance ---- */
  .talk .row { display: flex; gap: 9px; align-items: flex-start; }
  .talk .row .btn.big { font-size: 15px; padding: 12px 30px; }
  .talk .row .btn.wrap { white-space: normal; text-align: left; line-height: 1.25; }
  .talk .choice { display: flex; flex-direction: column; gap: 5px; }
  .talk .choice .sub {
    font-size: 11.5px; line-height: 1.35; color: var(--ink-dim);
    max-width: 268px; padding: 0 4px;
  }
  .talk .choice .sub.open { color: #0C8460; font-weight: 700; }
  .talk .choice .sub.over { color: #8F6310; font-weight: 700; }

  /* Never disabled — only dressed. The learner has to be able to press
     at the wrong moment, so these are states, not guard rails.
     ID selectors so they outrank .btn:hover in the shared sheet. */
  #speak.wait, #speak.wait:hover {
    background: #E8EBF2; border-color: #D2D8E4; color: #6A7183; transform: none;
  }
  #speak.open, #speak.open:hover {
    background: var(--good); border-color: var(--good); color: #fff;
  }
  #speak.over, #speak.over:hover {
    background: #C98A10; border-color: #C98A10; color: #fff;
  }

  .talk .foot {
    font-size: 11.5px; color: var(--ink-dim); line-height: 1.4; margin-top: 9px;
  }

  @media (max-width: 760px) {
    .toasts { max-width: min(280px, 60vw); }
    .talk .row { flex-direction: column; align-items: stretch; }
    .talk .row .btn.wrap { text-align: center; }
    .talk .choice .sub { max-width: none; text-align: center; }
  }

  /* The ending's turn markers. Scoped past `.modal li b`, which would
     otherwise paint them back to plain ink. */
  .modal li b.ok { color: var(--good); }
  .modal li b.no { color: var(--danger); }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar" id="topbar" style="align-items:flex-start">
    <div class="panel" style="max-width:min(480px,52vw)">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
      <div class="stats" id="stats"></div>
      <button class="btn ghost clickable" id="restart" type="button"></button>
    </div>
  </div>

  <div style="flex:1"></div>

  <div class="panel clickable talk" id="talk">
    <div class="howto" id="howto"></div>
    <div class="cue" id="cue"><i class="dot"></i><span id="cueText"></span></div>
    <div class="row">
      <div class="choice">
        <button class="btn primary big clickable" id="speak" type="button"></button>
        <div class="sub" id="speakSub"></div>
      </div>
      <div class="choice">
        <button class="btn ghost wrap clickable" id="quiet" type="button"></button>
        <div class="sub" id="quietSub"></div>
      </div>
    </div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<div class="loading" id="loading">Pulling up a second chair…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
