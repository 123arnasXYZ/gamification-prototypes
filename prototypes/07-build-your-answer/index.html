<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let Learners Build Their Answer — Returns Desk</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  .toasts { bottom: 150px; }

  .builder { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: center; }
  .row .name {
    font-weight: 800; font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--blue); line-height: 1.25;
  }
  .row .name span { display: block; color: var(--ink-dim); font-size: 10px; letter-spacing: .02em; text-transform: none; font-weight: 700; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 700;
    padding: 7px 6px; border-radius: var(--r-sm);
    border: 2px solid var(--line-2); background: #fff; color: var(--ink);
    cursor: pointer; transition: border-color .14s, background .14s, color .14s;
  }
  .chip:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
  .chip:disabled { opacity: .55; cursor: default; }

  .foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .foot .say { flex: 1 1 240px; min-width: 0; font-size: 12.5px; color: var(--ink-dim); }

  /* The two marks, one per half of the answer */
  .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mark { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 12px; }
  .mark .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .mark .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--ink-dim); }
  .mark .m { font-weight: 800; font-size: 12.5px; }
  .mark.s2 { border-color: #9FE3C6; background: #F3FCF8; }
  .mark.s2 .m { color: var(--good, #12A177); }
  .mark.s1 { border-color: #F0D79B; background: #FEFAF1; }
  .mark.s1 .m { color: #9A6B08; }
  .mark.s0 { border-color: #F3B9C7; background: #FEF5F7; }
  .mark.s0 .m { color: var(--danger, #B51C40); }
  .mark p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-dim); line-height: 1.4; }
  .verdict-line { font-size: 19px; font-weight: 800; color: var(--blue); letter-spacing: -0.01em; }

  #bottom { width: min(980px, 96vw); margin: 0 auto; flex: 0 0 auto; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr; gap: 5px; }
    .chips { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer" id="ui">
  <div class="col" id="col">
    <div class="topbar" id="topbar" style="align-items:flex-start">
      <div class="panel" style="max-width:min(430px,48vw)">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
      </div>
      <div class="spacer"></div>
      <div style="display:flex;gap:9px;align-items:center">
        <div class="panel" id="tried" style="padding:8px 14px;font-size:12.5px;font-weight:700"></div>
        <button class="btn ghost clickable" id="restart" type="button">Restart</button>
      </div>
    </div>

    <div style="flex:1"></div>
  </div>

  <div class="panel clickable" id="bottom"></div>
</div>

<div class="loading" id="loading">Opening the desk…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
