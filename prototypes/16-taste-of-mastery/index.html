<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Taste of Mastery — Set Up the Desk</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The board across the bottom is tall, so messages move to the top
     right strip instead of sitting on top of it. */
  .toasts { left: auto; right: 18px; bottom: auto; top: 112px; transform: none; align-items: flex-end; max-width: min(380px, 44vw); }

  .board { width: min(1040px, 100%); margin: 0 auto; }

  .banner { font-size: 13.5px; color: var(--ink); margin: 4px 0 0; line-height: 1.45; }

  /* The five things, as status chips you can also click to pick up */
  .tray { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  .chip {
    flex: 1 1 0; min-width: 132px;
    font: inherit; font-size: 13px; font-weight: 700; text-align: left;
    padding: 8px 12px; border-radius: var(--r-sm);
    border: 2px solid var(--line-2); background: #fff; color: var(--ink);
    cursor: pointer; transition: border-color .14s, background .14s, color .14s;
    line-height: 1.3;
  }
  .chip:hover:not(:disabled) { border-color: var(--blue); }
  .chip.held { border-color: var(--blue); background: var(--blue); color: #fff; }
  .chip.done { border-color: var(--good); }
  .chip .sub {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: .02em;
    color: var(--ink-dim); margin-top: 2px; overflow-wrap: anywhere;
  }
  .chip.held .sub { color: rgba(255,255,255,.8); }
  .chip.done .sub { color: var(--good); }

  /* The assessor only exists in beat one */
  .assessor { margin-top: 11px; border-top: 1px solid var(--line); padding-top: 9px; }
  .assessor .log { max-height: 108px; overflow-y: auto; margin-top: 5px; }
  .assessor .line {
    border-left: 3px solid var(--good); padding: 1px 0 1px 10px; margin-bottom: 6px;
    font-size: 12.5px; color: var(--ink-dim); line-height: 1.45;
  }
  .assessor .line b { color: var(--ink); }
  .assessor .line.wait { border-left-color: var(--line-2); font-style: italic; }

  @media (max-width: 760px) {
    .tray { flex-direction: column; }
    .chip { flex: none; }
    .toasts { max-width: min(300px, 60vw); }
  }

  /* The ending comparison inside the result modal */
  .cmp { display: grid; gap: 3px; }
  .cmp .who { font-size: 12.5px; }
  .cmp .tag { font-style: italic; color: var(--ink-dim); font-size: 12.5px; }
  .ok { color: var(--good); font-weight: 800; }
  .no { color: var(--danger); font-weight: 800; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar" style="align-items:flex-start">
    <div class="panel" style="max-width:min(560px,56vw)">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
      <div class="stats" id="stats"></div>
      <button class="btn ghost clickable" id="restart" type="button">Restart</button>
    </div>
  </div>

  <div style="flex:1"></div>

  <div class="dock">
    <div class="hint" id="hint"></div>
  </div>

  <div class="panel clickable board" id="board"></div>
</div>

<div class="loading" id="loading">Wheeling the chair into place…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
