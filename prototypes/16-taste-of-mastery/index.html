<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Taste of Mastery — Document Review</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The reviewer's note across the bottom is tall, so messages move to
     the top right strip instead of landing on top of it. */
  .toasts {
    left: auto; right: 18px; bottom: auto; top: 112px;
    transform: none; align-items: flex-end; max-width: min(380px, 44vw);
  }

  .board { width: min(760px, 100%); margin: 0 auto; }

  /* Beats two and three: one line saying the help is gone. */
  .banner { font-size: 13.5px; color: var(--ink); margin: 0; line-height: 1.45; }

  /* Beat one: the running note, one line per flag */
  .note .log { max-height: 118px; overflow-y: auto; margin-top: 6px; }
  .note .line {
    border-left: 3px solid var(--good); padding: 1px 0 1px 10px; margin-bottom: 7px;
    font-size: 12.5px; color: var(--ink-dim); line-height: 1.45;
  }
  .note .line b { color: var(--ink); }
  .note .line.wait { border-left-color: var(--line-2); font-style: italic; }

  @media (max-width: 760px) {
    .toasts { max-width: min(300px, 60vw); }
  }

  /* The ending's caught / missed markers */
  .ok { color: var(--good); font-weight: 800; }
  .no { color: var(--danger); font-weight: 800; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar" style="align-items:flex-start">
    <div class="panel" style="max-width:min(540px,54vw)">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
      <div class="stats" id="stats"></div>
      <button class="btn ghost clickable" id="restart" type="button">Restart</button>
    </div>
  </div>

  <div style="flex:1"></div>

  <div class="dock">
    <div class="hint" id="hint"></div>
    <div style="flex:1"></div>
    <button class="btn primary clickable" id="send" type="button"></button>
  </div>

  <div class="panel clickable board" id="board"></div>
</div>

<div class="loading" id="loading">Pulling the report off the printer…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
