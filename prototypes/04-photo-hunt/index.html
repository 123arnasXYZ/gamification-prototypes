<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Hunt — Warehouse Site Walk</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* Viewfinder chrome, specific to this prototype */
  .viewfinder { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .viewfinder .corner {
    position: absolute; width: 34px; height: 34px;
    border: 2px solid rgba(255,255,255,0.7);
  }
  .viewfinder .tl { top: 13%;  left: 16%;  border-right: 0; border-bottom: 0; }
  .viewfinder .tr { top: 13%;  right: 16%; border-left: 0;  border-bottom: 0; }
  .viewfinder .bl { bottom: 17%; left: 16%;  border-right: 0; border-top: 0; }
  .viewfinder .br { bottom: 17%; right: 16%; border-left: 0;  border-top: 0; }
  .viewfinder .reticle {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
    margin: -8px 0 0 -8px; border: 2px solid var(--blue); border-radius: 50%;
  }

  .flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 30;
  }
  .flash.fire { animation: flash .32s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  .roll { display: flex; gap: 7px; align-items: flex-end; }
  .roll .shot {
    width: 76px; height: 50px; border-radius: 4px; overflow: hidden;
    border: 2px solid #fff; background: #000; box-shadow: var(--shadow-sm);
    animation: shot-in .34s cubic-bezier(.2,.9,.3,1) both;
  }
  .roll .shot.miss { border-color: var(--danger); opacity: .55; }
  .roll .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes shot-in { from { transform: translateY(14px) scale(.85); opacity: 0; } }

  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex: none; }
  .found { display: flex; flex-direction: column; gap: 5px; }
  .found .item { font-size: 12.5px; color: var(--good); }
  .found .item.todo { color: var(--ink-dim); }

  .walk { display: flex; gap: 8px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="viewfinder">
  <i class="corner tl"></i><i class="corner tr"></i>
  <i class="corner bl"></i><i class="corner br"></i>
  <i class="reticle"></i>
</div>
<div class="flash" id="flash"></div>

<div class="ui-layer">
  <div class="topbar" style="align-items:flex-start">
    <div class="panel">
      <div class="eyebrow" id="eyebrow">Site walk</div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <!-- Stacked, not side by side: in a short embed frame a row of three
         panels runs out of width and the log lands on top of the stats. -->
    <div class="side">
      <div class="stats" id="stats"></div>
      <div class="panel" style="min-width:190px">
        <div class="eyebrow" style="margin-bottom:7px">Hazard log</div>
        <div class="found" id="found"></div>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="panel clickable" style="padding:11px 13px">
      <div class="eyebrow" style="margin-bottom:8px">Walk to</div>
      <div class="walk" id="walk"></div>
    </div>
    <div style="flex:1"></div>
    <div class="roll" id="roll"></div>
    <div class="hint" id="hint">Drag to look · click a hazard to photograph it</div>
    <button class="btn ghost clickable" id="restart" type="button">Restart</button>
  </div>
</div>

<div class="loading" id="loading">Walking on site…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
