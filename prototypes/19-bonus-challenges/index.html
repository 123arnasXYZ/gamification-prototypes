<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add Bonus Challenges — Build Tomorrow</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The action bar sits across the bottom; keep toasts clear of it */
  .toasts { bottom: 104px; }

  .bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .bar .say { flex: 1 1 260px; min-width: 0; }
  .bar .say .lead { font-size: 14px; font-weight: 700; color: var(--ink); }
  .bar .say .sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .bar .say .sub.warn { color: var(--amber, #B57D05); }
  .bar .acts { display: flex; gap: 9px; flex: none; }

  #bottom { width: min(980px, 96vw); margin: 0 auto; flex: 0 0 auto; }

  /* A short, wide frame puts the bar down the right instead, so the
     grid keeps its height. main.js reads the flex-direction. */
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  @media (max-height: 620px) and (min-width: 900px) {
    .ui-layer { flex-direction: row; align-items: stretch; gap: 14px; }
    #bottom { width: min(246px, 28vw); margin: 0; align-self: stretch; overflow-y: auto; }
    .bar { flex-direction: column; align-items: stretch; }
    .bar .acts { flex-direction: column; }
    .toasts { left: 20px; bottom: 20px; transform: none; align-items: flex-start; max-width: min(360px, 40vw); }
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer" id="ui">
  <div class="col" id="col">
    <div class="topbar" id="topbar" style="align-items:flex-start">
      <div class="panel" style="max-width:min(460px,52vw)">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost clickable" id="restart" type="button">Restart</button>
    </div>

    <div style="flex:1"></div>
  </div>

  <div class="panel clickable" id="bottom"></div>
</div>

<div class="loading" id="loading">Opening tomorrow…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
