<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add Bonus Challenges — Fire Safety Refresher</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The question panel is tall, so the achievement toasts move to the
     top-right strip instead of sitting under it */
  .toasts { left: auto; right: 18px; bottom: auto; top: 58px; transform: none; align-items: flex-end; max-width: min(380px, 46vw); }

  /* Badge row: locked ones are named and grey, earned ones light up */
  .chips { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px 5px 6px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 12px; font-weight: 700; color: var(--ink-dim);
    opacity: .62;
  }
  .chip .n {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 800;
    background: var(--grey); color: var(--ink-dim);
  }
  .chip .sub { font-weight: 600; font-size: 11.5px; opacity: .85; }
  .chip.earned { opacity: 1; border-color: var(--mint); color: var(--ink); }
  .chip.earned .n { background: var(--mint); color: #0C1A16; }
  .chip.revealed { opacity: 1; border-color: var(--blue); color: var(--blue); }
  .chip.hidden-badge .n { background: var(--line-2); color: #fff; }

  /* Question card */
  .quiz { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .quiz .q { font-size: 14.5px; font-weight: 600; color: var(--ink); margin: 0; line-height: 1.4; }
  .quiz .note { font-size: 12.5px; color: var(--ink-dim); min-height: 16px; }

  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt {
    font: inherit; font-size: 13.5px; font-weight: 600; text-align: left;
    padding: 9px 13px; border-radius: var(--r-sm);
    border: 2px solid var(--line-2); background: #fff; color: var(--ink);
    cursor: pointer; transition: border-color .14s, background .14s;
    line-height: 1.35;
  }
  .opt:hover:not(:disabled) { border-color: var(--blue); }
  .opt.picked { border-color: var(--blue); background: rgba(39, 87, 226, .07); }
  .opt.right { border-color: var(--good); background: rgba(18, 161, 119, .09); }
  .opt.wrongpick { border-color: var(--danger); background: rgba(224, 35, 78, .07); }
  .opt:disabled { cursor: default; }

  .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acts .grow { flex: 1 1 auto; }

  .aside {
    background: var(--grey); border-left: 3px solid var(--blue);
    border-radius: var(--r-sm); padding: 9px 12px;
    font-size: 13px; color: var(--ink-dim); line-height: 1.45;
    animation: aside-in .28s cubic-bezier(.2,.9,.3,1) both;
  }
  .aside.why { border-left-color: var(--mint); }
  @keyframes aside-in { from { opacity: 0; transform: translateY(8px); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar" style="align-items:flex-start">
    <div class="panel">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost clickable" id="restart" type="button">Restart</button>
  </div>

  <div class="dock" style="justify-content:center">
    <div class="chips clickable" id="chips"></div>
  </div>

  <div class="panel clickable" id="quiz" style="width:min(720px,96vw);margin:0 auto"></div>
</div>

<div class="loading" id="loading">Hanging the plaques…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
