<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defence Waves — Match the Control</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* Chip naming the threat in the current wave */
  .threat-chip {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px;
    font-size: 13px; font-weight: 700;
    padding: 6px 13px; border-radius: 999px;
    background: var(--grey); color: var(--ink);
  }
  .threat-chip i { width: 11px; height: 11px; border-radius: 3px; background: currentColor; }

  /* The picker that opens on the pad you clicked */
  .pad-menu {
    position: fixed;
    z-index: 30;
    transform: translate(-50%, 0);
    background: #fff;
    border-radius: var(--r);
    box-shadow: var(--shadow);
    padding: 10px;
    width: 268px;
    pointer-events: auto;
    animation: menu-in .16s ease both;
  }
  @keyframes menu-in { from { opacity: 0; transform: translate(-50%, -6px); } }
  /* Arrow on top: the pads sit in the upper half of the frame, so the
     menu hangs below them where there is always room. */
  .pad-menu::after {
    content: ""; position: absolute; left: var(--arrow, 50%); top: -7px;
    width: 14px; height: 14px; background: #fff;
    transform: translateX(-50%) rotate(45deg);
  }
  .pad-menu .head {
    font-style: italic; font-weight: 700; font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--blue); padding: 2px 6px 8px;
  }
  .pad-menu button {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    font: inherit; font-size: 13px;
    background: #fff; color: var(--ink);
    border: 2px solid var(--line); border-radius: var(--r-sm);
    padding: 9px 12px; margin-bottom: 7px;
    cursor: pointer;
    transition: border-color .14s, background .14s;
  }
  .pad-menu button:last-of-type { margin-bottom: 0; }
  .pad-menu button:hover { border-color: currentColor; background: var(--grey); }
  .pad-menu button .dot { width: 12px; height: 12px; border-radius: 3px; background: currentColor; flex: none; }
  .pad-menu button .name { font-weight: 700; color: var(--ink); }
  .pad-menu button .sub  { font-size: 11.5px; color: var(--ink-dim); }
  .pad-menu .cancel {
    border-color: transparent; color: var(--ink-dim);
    justify-content: center; font-weight: 700; font-size: 12px;
    margin-top: 2px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar">
    <div class="panel" style="max-width:min(460px,54vw)">
      <div class="eyebrow" id="eyebrow">Wave 1 of 2</div>
      <p id="intel" style="color:var(--ink);font-size:14px;margin-top:4px"></p>
      <div class="threat-chip" id="threatChip"><i></i><span></span></div>
    </div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="dock">
    <div class="hint" id="hint">Click a pad, then choose the control to put there.</div>
    <div style="flex:1"></div>
    <button class="btn primary clickable" id="go" type="button">Start wave 1</button>
    <button class="btn ghost clickable" id="restart" type="button">Restart</button>
  </div>
</div>

<div class="loading" id="loading">Arming the perimeter…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
