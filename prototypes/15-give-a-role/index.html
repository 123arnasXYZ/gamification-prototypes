<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Give Learners a Role — One Incident, Three Jobs</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  /* The bottom panel carries three role cards, so it is tall — keep
     consequence toasts above it rather than behind it. */
  .toasts { bottom: 280px; }

  .deck { width: 100%; display: flex; flex-direction: column; gap: 11px; }
  .deck .prompt { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .deck .note { font-size: 13px; color: var(--ink-dim); }

  /* Role picker: three cards, each saying what that job owns */
  .cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .card {
    flex: 1 1 180px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
    background: var(--grey); border: 2px solid var(--line);
    border-radius: var(--r); padding: 12px 13px;
    text-align: left; font: inherit; cursor: pointer;
    transition: border-color .15s ease, transform .12s ease;
  }
  .card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .card .who { font-size: 14.5px; font-weight: 800; color: var(--ink); }
  .card .dut { font-size: 12.5px; color: var(--ink-dim); line-height: 1.45; }
  .card .swatch { width: 26px; height: 5px; border-radius: 3px; }
  .card.tried { opacity: .72; }
  .card .done { font-size: 10.5px; font-weight: 800; letter-spacing: .08em;
                text-transform: uppercase; color: var(--good); }

  /* The duty manager's briefing, in their voice */
  .brief {
    background: var(--grey); border-left: 3px solid var(--blue);
    border-radius: var(--r-sm); padding: 11px 13px;
    font-size: 14px; color: var(--ink); font-style: italic;
  }
  .facts { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-dim); }
  .facts li { margin-bottom: 3px; }

  .opts { display: flex; gap: 9px; flex-wrap: wrap; }
  .opts .btn { flex: 1 1 190px; text-align: left; border-radius: var(--r); }

  .tried-chip {
    font-size: 11.5px; font-weight: 700; color: var(--ink-dim);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow-sm);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer">
  <div class="topbar" style="align-items:flex-start">
    <div class="panel" style="max-width:min(420px,52vw)">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title" id="title"></div>
    </div>
    <div class="spacer"></div>
    <div style="display:flex;flex-direction:column;gap:9px;align-items:flex-end">
      <div class="tried-chip" id="tried"></div>
      <button class="btn ghost clickable" id="restart" type="button">Restart</button>
    </div>
  </div>

  <div style="flex:1"></div>

  <div class="panel clickable" id="bottom" style="width:min(700px,96vw);margin:0 auto"></div>
</div>

<div class="loading" id="loading">Opening the doors…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
