<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Give Learners a Role — The Bridge</title>
<!-- ?v= bumps the cache when the shared styling changes -->
<link rel="stylesheet" href="../../shared/style.css?v=2">
<style>
  .toasts { bottom: 112px; }

  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bar .say { flex: 1 1 240px; min-width: 0; }
  .bar .say .lead { font-size: 14px; font-weight: 700; color: var(--ink); }
  .bar .say .sub { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .bar .say .sub.warn { color: #B57D05; }
  .bar .acts { display: flex; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .bar .acts .btn { font-size: 13px; padding: 9px 14px; }

  #bottom { width: min(980px, 96vw); margin: 0 auto; flex: 0 0 auto; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="ui-layer" id="ui">
  <div class="col" id="col">
    <div class="topbar" id="topbar" style="align-items:flex-start">
      <div class="panel" style="max-width:min(460px,52vw)">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost clickable" id="restart" type="button">Restart</button>
    </div>

    <div style="flex:1"></div>
  </div>

  <div class="panel clickable" id="bottom"></div>
</div>

<div class="loading" id="loading">Joining the bridge…</div>

<script type="module" src="./main.js"></script>
</body>
</html>
